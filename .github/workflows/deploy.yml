name: Build and Push to GitHub Container Registry

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.create_tags.outputs.TAG }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Appropriate Image Tags
        id: create_tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "TAG=prod-${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/baranuel/casefiles:${{ steps.create_tags.outputs.TAG }}
            ghcr.io/baranuel/casefiles:latest
      
  bump-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra@dev
        uses: actions/checkout@v3
        with:
          repository: baranuel/casefiles-infra
          token: ${{ secrets.PAT }}
          ref: dev
          path: infra

      - name: Bump FRONTEND_TAG
        run: |
          cd infra
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=${{ needs.build.outputs.TAG }}/" docker-stack.env
          git add docker-stack.env
          git commit -m "chore: bump FE to ${{ needs.build.outputs.TAG }} (dev)"

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          path: infra
          token: ${{ secrets.PAT }}
          branch: bump-frontend-dev-${{ needs.build.outputs.TAG }}
          base: dev
          title: "chore: bump FE to ${{ needs.build.outputs.TAG }} dev"
          body: "Deploy frontend ${{ needs.build.outputs.TAG }} to dev"
          labels: automated
          delete-branch: true

      - name: Auto-merge PR
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          repository: baranuel/casefiles-infra
          token: ${{ secrets.PAT }}
          pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
